apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dev-kafka
  labels:
    app: dev-kafka-app
spec:
  serviceName: dev-kafka-svc
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      app: dev-kafka-app
  template:
    metadata:
      labels:
        app: dev-kafka-app
    spec:
      containers:
        - name: kafka-container
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          ports:
            - containerPort: 9092
            - containerPort: 9093
#          command: ["bash", "-c"]
#          args:
#          - |-
#            sleep 3600
          env:
            - name: REPLICAS
              value: '1'
            - name: SERVICE
              value: dev-kafka-svc
            - name: NAMESPACE
              value: test
            - name: SHARE_DIR
              value: /mnt/kafka
            - name: CLUSTER_ID
              value: yui6qnH9Q3WdmsyA5LmVNw
            - name: DEFAULT_REPLICATION_FACTOR
              value: '{{ .Values.kafka.replicas }}'
            - name: DEFAULT_MIN_INSYNC_REPLICAS
              value: '1'
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "{{ .Values.kafka.messageMaxBytes | default \"1048576\" }}"
            - name: KAFKA_REPLICA_FETCH_MAX_BYTES
              value: "{{ .Values.kafka.replicaFetchMaxBytes | default \"1048576\" }}"
          volumeMounts:
            - name: data
              mountPath: /mnt/kafka
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "{{ .Values.kafka.storage_size }}"

---
apiVersion: v1
kind: Service
metadata:
  name: dev-kafka-svc
  labels:
    app: dev-kafka-app
spec:
  ports:
    - name: kafka-9092
      port: 9092
      protocol: TCP
      targetPort: 9092
  selector:
    app: dev-kafka-app
